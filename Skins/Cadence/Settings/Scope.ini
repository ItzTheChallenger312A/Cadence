[Rainmeter]
Group=Cadence | Settings
Update=50
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=0,0,0,1
OnRefreshAction=[!SetOption MeterNavScope MeterStyle StyleSidebarActive][!UpdateMeter MeterNavScope][!Redraw]

[Variables]
@include=#@#Variables.inc
@include2=#@#Styles.inc
SettingHeight=690

@include3=#@#Include\MeterSettingsMenu.inc

; --- Mouse Drag Sliders ---
[MeasureMouseScopeSharp]
Measure=Plugin
Plugin=Mouse
RelativeToSkin=1
RequireDragging=1
UpdateRate=20
Disabled=1
DynamicVariables=1
Group=MouseSliders
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
LeftMouseDragAction=[!WriteKeyValue Variables ScopeSharpness "(Round(Clamp(($MouseX$-224)/484,0,1)*2.2+0.3,1))" "#@#Variables.inc"][!SetVariable ScopeSharpness "(Round(Clamp(($MouseX$-224)/484,0,1)*2.2+0.3,1))"][!UpdateMeasure MeasureCalcScopeSharp][!UpdateMeterGroup ValScopeSharp][!Redraw]

[MeasureMouseScopeThick]
Measure=Plugin
Plugin=Mouse
RelativeToSkin=1
RequireDragging=1
UpdateRate=20
Disabled=1
DynamicVariables=1
Group=MouseSliders
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
LeftMouseDragAction=[!WriteKeyValue Variables ScopeThickness "(Round(Clamp(($MouseX$-224)/484,0,1)*3.4+0.6,1))" "#@#Variables.inc"][!SetVariable ScopeThickness "(Round(Clamp(($MouseX$-224)/484,0,1)*3.4+0.6,1))"][!UpdateMeasure MeasureCalcScopeThick][!UpdateMeterGroup ValScopeThick][!Redraw]

[MeasureMouseScopeSens]
Measure=Plugin
Plugin=Mouse
RelativeToSkin=1
RequireDragging=1
UpdateRate=20
Disabled=1
DynamicVariables=1
Group=MouseSliders
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
LeftMouseDragAction=[!WriteKeyValue Variables ScopeSensitivity "(Round(Clamp(($MouseX$-224)/484,0,1)*2.2+0.3,1))" "#@#Variables.inc"][!SetVariable ScopeSensitivity "(Round(Clamp(($MouseX$-224)/484,0,1)*2.2+0.3,1))"][!UpdateMeasure MeasureCalcScopeSens][!UpdateMeterGroup ValScopeSens][!Redraw]

[MeasureMouseScopeGlow]
Measure=Plugin
Plugin=Mouse
RelativeToSkin=1
RequireDragging=1
UpdateRate=20
Disabled=1
DynamicVariables=1
Group=MouseSliders
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
LeftMouseDragAction=[!WriteKeyValue Variables ScopeGlow "(Round(Clamp(($MouseX$-224)/484,0,1)*100,0))" "#@#Variables.inc"][!SetVariable ScopeGlow "(Round(Clamp(($MouseX$-224)/484,0,1)*100,0))"][!UpdateMeasure MeasureCalcScopeGlow][!UpdateMeterGroup ValScopeGlow][!Redraw]

[MeasureMouseScopeSmooth]
Measure=Plugin
Plugin=Mouse
RelativeToSkin=1
RequireDragging=1
UpdateRate=20
Disabled=1
DynamicVariables=1
Group=MouseSliders
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
LeftMouseDragAction=[!WriteKeyValue Variables ScopeSmoothing "(Round(Clamp(($MouseX$-224)/484,0,1)*0.85,2))" "#@#Variables.inc"][!SetVariable ScopeSmoothing "(Round(Clamp(($MouseX$-224)/484,0,1)*0.85,2))"][!UpdateMeasure MeasureCalcScopeSmooth][!UpdateMeterGroup ValScopeSmooth][!Redraw]

[MeasureMouseScopeSpeed]
Measure=Plugin
Plugin=Mouse
RelativeToSkin=1
RequireDragging=1
UpdateRate=20
Disabled=1
DynamicVariables=1
Group=MouseSliders
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
LeftMouseDragAction=[!WriteKeyValue Variables ScopeSpeed "(Round(Clamp(($MouseX$-224)/484,0,1)*2.3+0.2,1))" "#@#Variables.inc"][!SetVariable ScopeSpeed "(Round(Clamp(($MouseX$-224)/484,0,1)*2.3+0.2,1))"][!UpdateMeasure MeasureCalcScopeSpeed][!UpdateMeterGroup ValScopeSpeed][!Redraw]

[MeterTitle]
Meter=String
MeterStyle=StylePanelTitle
X=224
Y=24
Text=WMP Scope (Oscilloscope)

[MeterSubtitle]
Meter=String
MeterStyle=StyleBodyText
X=224
Y=4R
W=485
Text=Tune the Windows Media Player (2007–2013) oscilloscope trace, phosphor bloom, temporal smoothing, and stereo dual-beam overlay.

; --- Toggles ---
[MeterToggleScopeTrail]
Meter=Shape
X=224
Y=18R
Shape=Rectangle 0,0,40,22,11 | Extend TrackFill | StrokeWidth 0
TrackFill=Fill Color 58,64,76
Shape2=Ellipse (#ScopeTrail#=1 ? 29 : 11),11,8 | Fill Color 255,255,255 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!WriteKeyValue Variables ScopeTrail "(#ScopeTrail#=1?0:1)" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
[MeterToggleScopeTrailLabel]
Meter=String
MeterStyle=StyleSectionLabel
X=52r
Y=2r
Text=Phosphor afterglow trail

[MeterToggleScopeTaper]
Meter=Shape
X=224
Y=16R
Shape=Rectangle 0,0,40,22,11 | Extend TrackFill | StrokeWidth 0
TrackFill=Fill Color 58,64,76
Shape2=Ellipse (#ScopeEdgeTaper#=1 ? 29 : 11),11,8 | Fill Color 255,255,255 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!WriteKeyValue Variables ScopeEdgeTaper "(#ScopeEdgeTaper#=1?0:1)" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
[MeterToggleScopeTaperLabel]
Meter=String
MeterStyle=StyleSectionLabel
X=52r
Y=2r
Text=Pinch edges (Edge taper)

[MeterToggleScopeDual]
Meter=Shape
X=224
Y=16R
Shape=Rectangle 0,0,40,22,11 | Extend TrackFill | StrokeWidth 0
TrackFill=Fill Color 58,64,76
Shape2=Ellipse (#ScopeDualTrace#=1 ? 29 : 11),11,8 | Fill Color 255,255,255 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!WriteKeyValue Variables ScopeDualTrace "(#ScopeDualTrace#=1?0:1)" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
[MeterToggleScopeDualLabel]
Meter=String
MeterStyle=StyleSectionLabel
X=52r
Y=2r
Text=Dual-beam stereo trace

; --- Scope Sharpness ---
[MeasureCalcScopeSharp]
Measure=Calc
Formula=(Clamp((#ScopeSharpness#-0.3)/2.2,0,1))
DynamicVariables=1
[MeterLabelScopeSharp]
Meter=String
MeterStyle=StyleSectionLabel
X=224
Y=22R
Text=Scope Sharpness
[MeterValScopeSharp]
Meter=String
MeterStyle=StyleValueReadout
Group=ValScopeSharp
X=708
Y=0r
Text=#ScopeSharpness#x
DynamicVariables=1
[MeterSliderScopeSharp]
Meter=Shape
Group=ValScopeSharp
X=224
Y=10R
Shape=Rectangle 0,0,484,20 | Fill Color 0,0,0,1 | StrokeWidth 0
Shape2=Rectangle 0,8,484,4,2 | Fill Color 255,255,255,34 | StrokeWidth 0
Shape3=Rectangle 0,8,(484*[MeasureCalcScopeSharp]),4,2 | Fill LinearGradient SG1 | StrokeWidth 0
Shape4=Ellipse (484*[MeasureCalcScopeSharp]),10,7 | Fill Color 255,255,255 | StrokeWidth 0
SG1=0 | #Color1# ; 0.0 | #Color3# ; 1.0
DynamicVariables=1
MouseScrollUpAction=[!WriteKeyValue Variables ScopeSharpness "(Round(Clamp(#ScopeSharpness#+0.1,0.3,2.5),1))" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
MouseScrollDownAction=[!WriteKeyValue Variables ScopeSharpness "(Round(Clamp(#ScopeSharpness#-0.1,0.3,2.5),1))" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
MouseOverAction=[!DisableMeasureGroup MouseSliders][!EnableMeasure MeasureMouseScopeSharp]
LeftMouseDownAction=[!SetVariable ScopeSharpness "(Round(Clamp($MouseX$/484,0,1)*2.2+0.3,1))"][!UpdateMeasure MeasureCalcScopeSharp][!UpdateMeterGroup ValScopeSharp][!Redraw]
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!WriteKeyValue Variables ScopeSharpness "(Round(Clamp($MouseX$/484,0,1)*2.2+0.3,1))" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]

