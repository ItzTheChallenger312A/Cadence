MouseScrollDownAction=[!WriteKeyValue Variables ScopeThickness "(Round(Clamp(#ScopeThickness#-0.1,0.6,4.0),1))" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]
MouseOverAction=[!DisableMeasureGroup MouseSliders][!EnableMeasure MeasureMouseScopeThick]
LeftMouseDownAction=[!SetVariable ScopeThickness "(Round(Clamp($MouseX$/484,0,1)*3.4+0.6,1))"][!UpdateMeasure MeasureCalcScopeThick][!UpdateMeterGroup ValScopeThick][!Redraw]
LeftMouseUpAction=[!DisableMeasureGroup MouseSliders][!WriteKeyValue Variables ScopeThickness "(Round(Clamp($MouseX$/484,0,1)*3.4+0.6,1))" "#@#Variables.inc"][!Refresh "#ROOTCONFIG#\Visualizer"][!Refresh]

